
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border: 1px solid ;
        }

        h2 {
            text-align: center;
            color:#333;
        }

        .website-name {
            text-align: center;
            font-weight: bold;
            padding: 12px;
            background-color: #ddd;
            border: 1px solid #aaa;
        }

        .menu {
            display: flex;
            justify-content: space-around;
            background-color: #eee;
            padding: 12px;
            border: 1px solid #aaa;
        }

        .menu a {
            text-decoration: none;
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #999;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #ddd;
        }

        input[type="number"] {
            width: 55px;
            padding: 5px;
        }

        button {
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .remove-btn {
            background-color: #dc3545;
            color: white;
        }

        .checkout-btn {
            background-color: #198754;
            color: white;
            padding: 10px 18px;
            margin-top: 15px;
        }

        .total {
            text-align: right;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
        }

        .empty {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="website-name">Web Site Name - Online Book Store</div>

    <nav class="menu">
        <a href="#">Home</a>
        <a href="#">Login</a>
        <a href="#">Registration</a>
        <a href="#">Catalogue</a>
        <a href="cart.html">Cart</a>
    </nav>

    <h2>Shopping Cart</h2>

    <table>
        <thead>
            <tr>
                <th>Book Name</th>
                <th>Price (₹)</th>
                <th>Quantity</th>
                <th>Amount (₹)</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="cart-items"></tbody>
    </table>

    <div class="total">
        Total Amount: ₹<span id="grand-total">0.00</span>
    </div>

    <div style="text-align: right;">
        <button class="checkout-btn" onclick="checkout()">
            Proceed to Checkout
        </button>
    </div>

</div>

<script>
    
    let cart = [
        {
            name: "Java 2",
            price: 70,
            quantity: 2
        },
        {
            name: "XML Bible",
            price: 40.5,
            quantity: 1
        }
    ];

  
    function displayCart() {
        const cartItems = document.getElementById("cart-items");
        cartItems.innerHTML = "";

        if (cart.length === 0) {
            cartItems.innerHTML =
                '<tr><td colspan="5" class="empty">Your cart is empty.</td></tr>';
        }

        let total = 0;

        cart.forEach((book, index) => {
            const amount = book.price * book.quantity;
            total += amount;

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${book.name}</td>
                <td>₹${book.price.toFixed(2)}</td>
                <td>
                    <input
                        type="number"
                        min="1"
                        value="${book.quantity}"
                        onchange="updateQuantity(${index}, this.value)"
                        aria-label="Quantity for ${book.name}"
                    >
                </td>
                <td>₹${amount.toFixed(2)}</td>
                <td>
                    <button class="remove-btn"
                        onclick="removeBook(${index})">
                        Remove
                    </button>
                </td>
            `;

            cartItems.appendChild(row);
        });

        document.getElementById("grand-total").textContent =
            total.toFixed(2);
    }

    function updateQuantity(index, quantity) {
        quantity = Number(quantity);

        if (!Number.isInteger(quantity) || quantity < 1) {
            alert("Please enter a quantity of at least 1.");
            displayCart();
            return;
        }

        cart[index].quantity = quantity;
        displayCart();
    }

    function removeBook(index) {
        cart.splice(index, 1);
        displayCart();
    }


    function checkout() {
        if (cart.length === 0) {
            alert("Your cart is empty!");
            return;
        }

        const total = cart.reduce(
            (sum, book) => sum + book.price * book.quantity,
            0
        );

        alert("Order placed successfully!\nTotal Amount: ₹" +
            total.toFixed(2));

        cart = [];
        displayCart();
    }
    displayCart();
</script>

</body>
</html>
